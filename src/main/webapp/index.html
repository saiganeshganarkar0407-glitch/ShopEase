
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="#" class="logo">ShopEase<span>.</span></a>

    <input type="search" id="searchInput"
           placeholder="Search products...">

    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
</header>

<section class="hero">
    <div>
        <p class="eyebrow">YOUR EVERYDAY MARKETPLACE</p>
        <h1>Shopping made<br>simple.</h1>
        <p>Discover useful products at great prices.</p>
        <a href="#products" class="primary-btn">Explore Products</a>
    </div>
</section>

<main class="container">
    <section id="products">
        <div class="section-heading">
            <div>
                <h2>Featured Products</h2>
                <p>Find something you'll love.</p>
            </div>

            <select id="categoryFilter">
                <option value="all">All categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <p id="productMessage" role="status"></p>
        <div id="productGrid" class="product-grid"></div>
    </section>

    <section id="cart" class="cart-section">
        <h2>Your Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3>Total: ₹<span id="cartTotal">0.00</span></h3>

        <form id="checkoutForm">
            <label for="address">Shipping Address</label>
            <textarea id="address" rows="3"
                      maxlength="1000"
                      placeholder="Enter your delivery address"
                      required></textarea>

            <button type="submit" class="primary-btn">
                Place Order (Cash on Delivery)
            </button>
        </form>

        <p id="checkoutMessage" role="status"></p>
    </section>
</main>

<footer>
    <p>© 2026 ShopEase — Student E-Commerce Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
